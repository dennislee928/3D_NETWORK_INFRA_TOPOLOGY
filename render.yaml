services:
  # Render can host the adapter and frontend as Docker-based services.
  # The local Mininet/OVS topology lab is intentionally omitted here because
  # it requires privileged containers, host module access, and bind mounts.

  - type: web
    name: sdn-adapter-rust
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PORT
        value: "10000"
      - key: RUST_LOG
        value: info

  - type: web
    name: topology-frontend-3d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - web/**
        - render.yaml
    envVars:
      - key: SDN_ADAPTER_HOSTPORT
        fromService:
          type: web
          name: sdn-adapter-rust
          property: hostport
