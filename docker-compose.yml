services:
  opendaylight:
    image: opendaylight/odl:latest
    platform: linux/amd64
    container_name: odl_controller
    tty: true
    stdin_open: true
    ports:
      - "8181:8181" # RESTCONF
      - "6633:6633" # OpenFlow
      - "6653:6653" # OpenFlow (Newer ODL)
    environment:
      # ODL 需要安裝這些 feature 才能支援 OpenFlow 與 RESTCONF
      - ODL_INSTALL_FEATURES=odl-restconf,odl-openflowplugin-all,odl-mdsal-apidocs,odl-dlux-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/restconf/operational/network-topology:network-topology"]
      interval: 30s
      timeout: 10s
      retries: 5

  mininet:
    build:
      context: ./mininet
    container_name: mininet_network
    privileged: true
    volumes:
      - /lib/modules:/lib/modules:ro # 共享內核模組 (Mininet 需要)
    stdin_open: true
    tty: true
    depends_on:
      opendaylight:
        condition: service_healthy

  sdn-adapter:
    build: ./backend
    container_name: sdn_adapter
    ports:
      - "4000:4000"
    environment:
      - ODL_URL=http://opendaylight:8181
    depends_on:
      - opendaylight

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: topology_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_SDN_ADAPTER_URL=http://localhost:4000
    depends_on:
      - sdn-adapter
