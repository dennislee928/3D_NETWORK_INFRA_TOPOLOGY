services:
  ryu:
    image: python:3.11-slim
    container_name: ryu_controller
    ports:
      - "8080:8080" # Ryu REST API
      - "6633:6633" # OpenFlow
    command: >
      sh -c "pip install ryu && 
             ryu-manager ryu.app.rest_topology ryu.app.ofctl_rest ryu.app.simple_switch_13"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stats/switches"]
      interval: 10s
      timeout: 5s
      retries: 3

  mininet:
    build:
      context: ./mininet
    container_name: mininet_network
    privileged: true
    volumes:
      - /lib/modules:/lib/modules:ro
    stdin_open: true
    tty: true
    depends_on:
      ryu:
        condition: service_healthy

  sdn-adapter:
    build: ./backend
    container_name: sdn_adapter
    ports:
      - "4000:4000"
    environment:
      - SDN_TYPE=RYU
      - RYU_URL=http://ryu:8080
    depends_on:
      - ryu

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: topology_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_SDN_ADAPTER_URL=http://localhost:4000
    depends_on:
      - sdn-adapter
